<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">lookout</div>
    <div class="what"><div id="title"></div><div id="label"></div></div>
    <div class="tools">
      <span id="mode" class="mode"></span>
      <span id="gate" class="gate"></span>
      <button type="button" id="ov-btn" class="ov-btn" aria-pressed="false" title="What each group of changes means (o)">Overview</button>
      <div class="seg" id="layout" role="group" aria-label="Diff layout">
        <button type="button" data-layout="split">Split</button>
        <button type="button" data-layout="unified">Unified</button>
      </div>
      <button type="button" id="keys-btn" class="keys-btn" aria-expanded="false" aria-controls="keys" title="Keyboard shortcuts (?)">?</button>
    </div>
    <div id="keys" class="keys-panel" role="dialog" aria-label="Keyboard shortcuts" hidden>
      <div><kbd>j</kbd> <kbd>k</kbd> next and previous file</div>
      <div><kbd>n</kbd> <kbd>p</kbd> next and previous finding</div>
      <div><kbd>o</kbd> overview</div>
      <div><kbd>v</kbd> split or unified</div>
      <div><kbd>?</kbd> this list</div>
    </div>
  </header>
  <div id="banner" hidden></div>
  <aside id="side">
    <div class="side-head">
      <span id="side-title">Changes</span>
      <div class="seg small" id="view" role="group" aria-label="File order" hidden>
        <button type="button" data-view="risk">Risk</button>
        <button type="button" data-view="path">Path</button>
      </div>
      <span id="side-count"></span>
    </div>
    <details id="side-note" class="side-note" hidden><summary>Risk from signals only</summary><div id="side-why"></div></details>
    <nav id="tree" aria-label="Changed files"></nav>
  </aside>
  <main id="main">
    <div id="file-head"></div>
    <div id="diff"></div>
  </main>
</div>
<script type="application/json" id="lookout-data">__DATA__</script>
<script>/*__JS__*/</script>
</body>
</html>
