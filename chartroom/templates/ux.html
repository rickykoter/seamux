<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option: name it</title>
<!--
  chartroom ux starter: ONE option of a ux chart. Copy it once per option
  (chartroom template ux a.html, b.html, c.html), make each option a real
  alternative, then: chartroom add <id> "a:Label=a.html" "b:Label=b.html".

  Rules this file keeps, and yours should too:
  - Self-contained: no network. Inline CSS and SVG; no images from URLs.
  - Real content: the product's actual words, numbers and states, never lorem ipsum.
  - Stable ids on the things people will comment on (id="pay", id="total"),
    so a pin on them follows the element into later versions.
  - Show the hard states too (empty, error, loading, long text) where they matter.
  - Icons as inline SVG, never emoji.
  Delete this comment when the option is real.
-->
<style>
  /* Tokens first: change these, not the rules below. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1d232a; --muted: #5b6570; --line: #e1e5ea;
    --accent: #2f6fde; --on-accent: #ffffff; --danger: #b3261e;
    --radius: 10px; --gap: 16px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar b { font-size: 17px; }
  main { max-width: 560px; margin: 28px auto; padding: 0 16px; display: grid; gap: var(--gap); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  label { display: grid; gap: 4px; margin-bottom: 12px; font-size: 14px; }
  input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .hint { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; }
  .primary { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: 600 16px var(--font); }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border: 0; font-weight: 700; }
</style>
</head>
<body>
  <header class="bar">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <b>Product name</b>
  </header>
  <main>
    <h1 id="headline">The one thing this screen is for</h1>
    <section class="card" id="summary">
      <h2>What the person sees first</h2>
      <div class="row"><span>A real line item</span><span>$42.00</span></div>
      <div class="row"><span>Another one</span><span>$8.50</span></div>
      <div class="row" id="total"><span>Total</span><span>$50.50</span></div>
    </section>
    <section class="card" id="form">
      <h2>What the person does</h2>
      <label>Field name<input id="field-1" placeholder="A realistic value"></label>
      <label>Field with an error<input id="field-2" value="not valid" aria-invalid="true"><span class="error">Say what is wrong and how to fix it.</span></label>
      <p class="hint">A hint where people get stuck.</p>
      <button class="primary" id="primary-action">Do the thing</button>
    </section>
  </main>
</body>
</html>
