[package]
name = "seamux-app"
description = "The seamux app: a Tauri window that owns the UI, with cmux behind crates/cmux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "seamux-app"
path = "src/main.rs"

# custom-protocol serves the built pages (app/dist) instead of the Vite dev
# server. The Tauri CLI turns it on for release builds; we build with plain
# cargo, so it is on by default. `--no-default-features` loads devUrl, for
# `npm run dev` with hot reload.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
cmux.workspace = true
crew-core.workspace = true
# The views act in-process (ADR: the app links crew-board and crew-store),
# so Desk and the Wake work while the intent server is down.
crew-board = { path = "../crew-board" }
crew-store = { path = "../crew-store" }
# The tmux notifier wears each workspace's crew-color (color::peek).
crew-cli = { path = "../crew-cli" }
# A Wake file shown in the sheet travels as a data: URL.
base64 = "0.22"
# A native terminal's PTY (pty.rs): openpty, setsid, TIOCSWINSZ.
libc = "0.2"
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# A Markdown file a pane links to is shown in the Dock (links_app.rs).
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# The overlay joins other apps' full-screen Spaces (FullScreenAuxiliary),
# which Tauri's visible-on-all-workspaces does not set. Same versions Tauri
# already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSWorkspace", "NSRunningApplication", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSData", "NSArray"] }
# tauri-plugin-notification's notifier, switched to UNUserNotificationCenter.
# The default NSUserNotificationCenter path reports every banner as dismissed
# within a second on current macOS (its deliveredNotifications check comes
# back without it), so a click or an action never reaches the app.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
