<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seamux</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --strip: #ececf0; --line: #d8d8de;
        --on: #ffffff; --accent: #b7791f; --bad: #c0392b; --good: #2f855a;
        --card: #ffffff; --shade: rgba(0, 0, 0, 0.06); --term: #f3f3f6; --term-fg: #2b2b30;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --strip: #121214; --line: #2c2c30;
          --on: #2a2a2e; --accent: #f2c462; --bad: #ff6b5b; --good: #68d391;
          --card: #232326; --shade: rgba(0, 0, 0, 0.4); --term: #161618; --term-fg: #d8d8dc;
        }
      }
      html, body { height: 100%; }
      body {
        margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
        font: 13px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden;
      }
      body > header {
        /* Left room for the window's own close / minimize / zoom buttons,
           which sit over this strip (titleBarStyle Overlay). */
        display: flex; align-items: center; gap: 4px; padding: 8px 10px 8px 84px; background: var(--strip);
        border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; cursor: default;
      }
      .mark { width: 16px; height: 16px; margin: 0 8px 0 2px; flex: none; }
      #strip { display: flex; gap: 2px; }
      .tab {
        font: inherit; color: var(--muted); background: none; border: 0; border-radius: 6px;
        padding: 4px 12px; cursor: pointer;
      }
      .tab:hover { color: var(--fg); }
      .tab.on { color: var(--fg); background: var(--on); box-shadow: 0 0 0 1px var(--line); }
      .grow { flex: 1; align-self: stretch; }
      #conn { color: var(--muted); font-size: 12px; margin-right: 8px; white-space: nowrap; }
      #conn::before {
        content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
        margin-right: 6px; vertical-align: 1px; background: var(--muted);
      }
      #conn.good::before { background: var(--good); }
      #conn.bad::before { background: var(--bad); }
      main { flex: 1; position: relative; min-height: 0; }
      .panel { position: absolute; inset: 0; overflow: auto; }
      .panel iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
      .note { max-width: 460px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
      .retry {
        font: inherit; margin-top: 10px; padding: 5px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: var(--on); color: var(--fg);
      }
      .panel[hidden] { display: none; }

      /* ---- the ⋯ menu: Usage and Board ---- */
      .more-wrap { position: relative; }
      .tab.more { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; }
      .tab.more svg { width: 16px; height: 16px; fill: currentColor; }
      .more-label:empty { display: none; }
      .menu {
        position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 150px;
        padding: 4px; border-radius: 9px; background: var(--card); border: 1px solid var(--line);
        box-shadow: 0 10px 28px var(--shade);
      }
      .menu[hidden] { display: none; }
      .menu-item {
        display: block; width: 100%; text-align: left; font: inherit; color: var(--fg);
        background: none; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
      }
      .menu-item:hover, .menu-item:focus-visible { background: var(--on); outline: none; }

      /* ---- the sheet: a plan, review or ask page over the current view ---- */
      .sheet {
        position: fixed; inset: 0; z-index: 40; display: flex; padding: 54px 18px 18px;
        background: color-mix(in srgb, var(--bg) 40%, transparent); backdrop-filter: blur(2px);
      }
      .sheet[hidden] { display: none; }
      .sheet-card {
        flex: 1; display: flex; flex-direction: column; min-width: 0; border-radius: 12px; overflow: hidden;
        background: var(--card); border: 1px solid var(--line); box-shadow: 0 18px 50px var(--shade);
      }
      .sheet-card header {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line);
      }
      .sheet-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sheet-say { flex: 1; color: var(--bad); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sheet-btn {
        display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; color: var(--fg);
        background: var(--on); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer;
      }
      .sheet-btn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
      .sheet-btn.icon { padding: 5px 7px; }
      .sheet-body { flex: 1; min-height: 0; display: flex; }
      .sheet-body iframe { flex: 1; border: 0; background: var(--bg); }

      /* ---- a view still to come ---- */
      .soon { max-width: 440px; margin: 16vh auto 0; text-align: center; color: var(--muted); }
      .soon pre { font: 12px/1.3 ui-monospace, Menlo, monospace; color: var(--accent); margin: 0 0 10px; }

      .muted { color: var(--muted); }
      .bad { color: var(--bad); }
      code { font: 12px ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <header data-tauri-drag-region>
      <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="0.5" y="0.5" width="15" height="15" rx="4" fill="currentColor" opacity="0.18" />
        <path d="M3 13 13 3" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" />
        <path d="M4.5 9.5l2 2M6.5 7.5l2 2M8.5 5.5l2 2" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" />
      </svg>
      <nav id="strip"></nav>
      <div class="grow" data-tauri-drag-region></div>
      <span id="conn">cmux</span>
    </header>
    <main id="stage">
      <section id="desk" aria-label="Desk"></section>
      <section id="mosaic" aria-label="Mosaic"><section id="wall" aria-label="Pane"></section></section>
      <section id="timeline" aria-label="Timeline"></section>
      <section id="wake" aria-label="Wake"></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
