<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seamux</title>
    <style>
      :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --bad: #c0392b; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --bad: #ff6b5b; } }
      body { margin: 0; padding: 16px 20px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, system-ui, sans-serif; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .muted { color: var(--muted); }
      .bad { color: var(--bad); }
      ul { padding-left: 18px; }
      code { font: 12px ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <h1>seamux</h1>
    <p id="status" class="muted">Connecting to cmux…</p>
    <ul id="workspaces"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
