# The seamux cargo workspace (ADR: app/ at the top level). Each crate under
# crates/ is a member: the parent's cmux client and seamux CLI, crew-core, and
# one crate per port (crew-store, crew-board, crew-cli, crew-hooks) plus the
# Tauri app. A new crate joins by existing; nothing here needs an edit.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# preserve_order: keys print in Python's insertion order. float_roundtrip:
# a float parses to the exact f64 Python reads, so it re-prints the same digits.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
cmux = { path = "crates/cmux" }
crew-core = { path = "crates/crew-core" }
