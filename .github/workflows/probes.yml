# Runs the scrub check, the plugin validation and every probe with no cmux
# present. Mermaid comes from `deep-plan setup`, which carries the pin and the
# sha256 and fails closed on a mismatch.
name: probes

on:
  push:
    branches: [main]
  pull_request:

env:
  # The probes and setup read the bundle from here, and look nowhere else.
  DEEP_PLAN_VENDOR_DIR: ${{ github.workspace }}/deep-plan/vendor

jobs:
  probes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # First, and before the network: an internal identifier in a tracked file
      # is the one failure that cannot be fixed by a follow-up commit.
      - name: scrub check
        run: python3 tools/scrub_check.py

      # The pointer and the shim land in the runner's temp dir, never in a
      # home the job does not own.
      - name: Fetch pinned mermaid (deep-plan setup)
        env:
          DEEP_PLAN_ENGINE_FILE: ${{ runner.temp }}/engine.json
          DEEP_PLAN_BIN_DIR: ${{ runner.temp }}/bin
        run: node deep-plan/deep_plan.mjs setup

      # The manifests, hooks and mods module as Claude Code reads them. The CLI
      # comes from npm; validate and test need no login.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .
          for p in deep-plan restack bash-guard crew seamux-mods; do claude plugin validate "$p"; done

      - name: seamux-mods tests
        run: claude plugin test seamux-mods

      - name: deep-plan probe
        run: node deep-plan/probe.mjs

      - name: board probe
        run: node crew/board/board_probe.mjs

      # Real git repos in a temp dir; the probe carries its own identity and
      # GIT_CONFIG_GLOBAL, so a runner with no git user is the normal case.
      - name: restack probe
        run: node restack/probe.mjs

      # A local mock of /v1/systemone — asserts every failure path degrades to
      # "no judgment", so the TypeSafe layer can never change CI-less behavior.
      - name: typesafe probe
        run: python3 crew/hooks/typesafe_probe.py
