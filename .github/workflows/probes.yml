# Runs the scrub check, the plugin validation and every probe with no cmux
# present. Mermaid comes from `deep-plan setup` and highlight.js from `lookout
# setup`; each carries its pin and sha256 and fails closed on a mismatch.
name: probes

on:
  push:
    branches: [main]
  pull_request:

env:
  # The probes and setup read the bundle from here, and look nowhere else.
  DEEP_PLAN_VENDOR_DIR: ${{ github.workspace }}/deep-plan/vendor
  LOOKOUT_VENDOR_DIR: ${{ github.workspace }}/lookout/vendor

jobs:
  probes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # First, and before the network: an internal identifier in a tracked file
      # is the one failure that cannot be fixed by a follow-up commit.
      - name: scrub check
        run: python3 tools/scrub_check.py

      # claude plugin validate skips a SKILL.md at a plugin's root, which is
      # where every seamux skill lives (docs/adr/0004); this checks them.
      - name: skill lint
        run: python3 tools/skill_lint.py

      - name: skill lint, eval-harness and scrub-check probes
        run: python3 tools/skill_lint_probe.py && python3 tools/skill_evals_probe.py && python3 tools/scrub_check_probe.py

      - name: install.sh parses
        run: bash -n install.sh

      # The pointer and the shim land in the runner's temp dir, never in a
      # home the job does not own.
      - name: Fetch pinned mermaid (deep-plan setup)
        env:
          DEEP_PLAN_ENGINE_FILE: ${{ runner.temp }}/engine.json
          DEEP_PLAN_BIN_DIR: ${{ runner.temp }}/bin
        run: node deep-plan/deep_plan.mjs setup

      - name: Fetch pinned highlight.js (lookout setup)
        env:
          LOOKOUT_ENGINE_FILE: ${{ runner.temp }}/lookout-engine.json
          LOOKOUT_BIN_DIR: ${{ runner.temp }}/bin
        run: node lookout/lookout.mjs setup

      # The manifests, hooks and mods module as Claude Code reads them. The CLI
      # comes from npm; validate and test need no login.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .
          for p in deep-plan restack bash-guard crew seamux-mods lookout humanize; do claude plugin validate "$p" || exit 1; done

      - name: seamux-mods tests
        run: claude plugin test seamux-mods

      # The whole plugin install, previewed under a throwaway HOME: nothing is
      # written, no network, and the claude CLI is only looked up. Without
      # cargo and the Xcode tools it says crew is skipped, which is fine here.
      - name: install.sh --dry-run
        run: |
          home="$(mktemp -d)"
          HOME="$home" ./install.sh --dry-run

      # Every must-block and must-allow command, read by python3 and by the
      # plain-shell fallback; macOS runs it under its own bash.
      - name: bash-guard probe
        run: bash bash-guard/hooks/guard_bash_probe.sh

      - name: deep-plan probe
        run: node deep-plan/probe.mjs

      - name: board probe
        run: node crew/board/board_probe.mjs

      # Throwaway repos, reviews, pointer and shim under a temp dir; a mock
      # TypeSafe client, so nothing reaches the network.
      - name: lookout probe
        env:
          LOOKOUT_PROBE_HLJS: ${{ github.workspace }}/lookout/vendor/highlight.min.js
        run: node lookout/probe.mjs

      # Real git repos in a temp dir; the probe carries its own identity and
      # GIT_CONFIG_GLOBAL, so a runner with no git user is the normal case.
      - name: restack probe
        run: node restack/probe.mjs

      # A local mock of /v1/systemone — asserts every failure path degrades to
      # "no judgment", so the TypeSafe layer can never change CI-less behavior.
      - name: typesafe probe
        run: python3 crew/hooks/typesafe_probe.py

      # A deep-plan family through the real crew-sync and crew-color, against a
      # fake cmux (crew/tools/fakecmux.py): tokens, shades, and the colors from
      # before coming back when the family closes.
      - name: family sync probe
        run: python3 crew/tools/family_sync_probe.py

      # The ten crew CLIs port-cli ports, black-box against fakecmux in a
      # throwaway HOME; the same run proves the Rust with CREW_IMPL=rust.
      - name: cli probe
        run: python3 crew/tools/cli_probe.py

      # The default probes in .seamux/verify.json that CI did not run. Each
      # works in a throwaway HOME against fakecmux, with no app and no network.
      - name: hooks probe
        run: python3 crew/tools/hooks_probe.py

      - name: workspaces probe
        run: python3 crew/tools/workspaces_probe.py

      - name: artifacts probe
        run: python3 crew/tools/artifacts_probe.py

      - name: wake split probe
        run: python3 crew/tools/wake_split_probe.py

      - name: core probe
        run: python3 crew/tools/core_probe.py

      - name: CREW_IMPL helper probe
        run: python3 crew/tools/crew_impl_probe.py

      - name: crew install probe (apply, uninstall, sandboxes)
        run: python3 crew/tools/install_probe.py

  # The seamux app (app/): its pages, then every crate in the cargo workspace.
  # macOS only. It is the one platform the app ships for, the crates' macOS
  # paths (objc2, the overlay panel) only compile there, and the runner needs no
  # system packages. Ubuntu would need webkit2gtk-4.1, ayatana-appindicator,
  # librsvg and libxdo for Tauri, and would test code paths nobody runs.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # Before cargo: the Tauri crate's build script reads app/dist.
      - name: app pages (tsc and vite build)
        working-directory: app
        run: npm ci && npm run build

      - name: cargo test, every crate
        run: cargo test --manifest-path app/Cargo.toml --workspace
