<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>crew · usage</title>
<!--
  Served by crew-board-intent at /usage. Data is injected as __DATA__ by the
  server, which shells out to `ccusage`. Windows and budgets, not dollars:
  every ratio is ccusage totalTokens (cache reads included) on both sides,
  against CREW_BLOCK_BUDGET / CREW_WEEK_BUDGET or the largest window/week on
  record.

  The window card carries BOTH framings and the viewer picks: tokens against
  the budget, or time against the reset. They answer different questions and
  neither is always the constraint -- and when no budget is set the derived one
  is the largest window you have ever had, which is a guess, while the clock is
  a fact. The choice persists in localStorage because the page reloads every
  60s. Time is computed from the block's own endTime, never from the served
  remainingMinutes, which is stale the moment the snapshot is written; the
  window's length comes from the block's bounds, so `ccusage blocks
  --session-length` is honoured rather than a hardcoded 5h.

  Nothing here computes a price — with one deliberate exception: the
  per-workspace card at the bottom speaks dollars (ccusage totalCost via the
  shared costs cache), because "which worktree is burning money" is a question
  tokens cannot answer.

  One data hue, #e69875. It is the only Everforest colour that clears the
  dataviz validator's chroma floor (teal, aqua, green and pink all read as grey
  against this surface at 0.06-0.09) AND is not already a status token on the
  crew board -- gold is "needs you", red is "broken", green is "done", teal is
  "working". A status colour reused for a series is the first entry in the
  anti-pattern list.
-->
<style>
:root{
  --bg:#2d353b; --card:#343f44; --line:#2f3639; --line2:#3d484d;
  --ink:#d3c6aa; --muted:#859289; --faint:#5c6a72;
  --data:#e69875;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:11px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;margin-bottom:9px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
h2{font:600 10px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.when{font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);white-space:nowrap}

/* Hero: same sans as everything else, and proportional figures -- tabular digits
   make a large number look loose. */
.hero{font:600 30px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:-.02em;color:var(--ink);font-variant-numeric:proportional-nums}
.hero small{font-size:14px;font-weight:500;color:var(--muted);margin-left:5px}

/* Bullet bar: the track is the PROJECTED total, the fill is spent so far. One
   measure at two confidences, so one hue -- not two series, and no legend. */
.bullet{height:9px;border-radius:5px;background:var(--bg);border:1px solid var(--line2);
  margin:11px 0 7px;overflow:hidden}
.bullet i{display:block;height:100%;border-radius:5px;background:var(--data)}
.foot{display:flex;justify-content:space-between;gap:8px;
  font:500 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  font-variant-numeric:tabular-nums}

/* Bars. Rounded data-ends anchored to the baseline, a 2px surface gap between
   neighbours instead of a border, and a hit area that spans the full column
   height so a 200k-token day is as easy to hover as a 30M one. */
/* margin-top is the label gutter. Tags are positioned above the plot, so with no
   room they climb into the header -- the tag for today landed under the table
   button. */
.plot{position:relative;height:74px;margin-top:15px;display:flex;align-items:flex-end;gap:2px;
  border-bottom:1px solid var(--line2)}
.col{flex:1 1 0;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default}
.col i{display:block;width:100%;background:var(--data);border-radius:3px 3px 0 0;min-height:1px}
.col:hover i,.col:focus-visible i{filter:brightness(1.25)}
.col:focus-visible{outline:1px solid var(--data);outline-offset:1px}
.grid{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.axis{display:flex;justify-content:space-between;margin-top:5px;
  font:500 9.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);
  font-variant-numeric:tabular-nums}

/* Selective direct labels: the peak and today, never every bar. */
.tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;
  font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}

#tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity 90ms;
  background:#232a2e;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;
  font:500 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
#tip b{color:var(--data);font-weight:700}

/* The table twin. Every value the bars carry is reachable without hovering. */
.tbtn{font:600 9.5px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);background:none;border:1px solid var(--line2);border-radius:5px;
  padding:3px 7px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:9px;
  font:500 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--faint);font-weight:600;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:0 0 4px}
td{padding:2px 0;color:var(--muted);border-top:1px solid var(--line)}
td:last-child,th:last-child{text-align:right;color:var(--ink)}
[hidden]{display:none!important}

.models{margin:0;padding:0;list-style:none;
  font:500 11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  font-variant-numeric:tabular-nums}
.models li{display:flex;justify-content:space-between;gap:10px}
.models b{color:var(--ink);font-weight:600}
.wcosts{margin:0;padding:0;list-style:none;
  font:500 11px/2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
  font-variant-numeric:tabular-nums}
.wcosts li{display:flex;align-items:center;gap:10px}
.wcosts .nm{flex:0 0 34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcosts .bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.wcosts .bar i{display:block;height:100%;background:var(--data);border-radius:3px}
.wcosts b{color:var(--ink);font-weight:600;flex:none}
.empty{color:var(--faint);font-size:12px;padding:10px 2px}
</style></head>
<body>
<div id="app"></div>
<div id="tip" role="status" aria-live="polite"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById("data").textContent);
  var app = document.getElementById("app"), tip = document.getElementById("tip");
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); };
  var tok = function(n){
    n = n||0;
    if (n >= 1e9) return (n/1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
    if (n >= 1e3) return Math.round(n/1e3) + "k";
    return String(n);
  };
  var pctOf = function(n, budget){ return budget > 0 ? n / budget * 100 : 0; };

  if (D.error) { app.innerHTML = '<div class="card"><div class="empty">' + esc(D.error) + "</div></div>"; return; }

  function dur(min){
    min = Math.max(0, Math.round(min||0));
    var h = Math.floor(min/60), m = min%60;
    return h ? h+"h "+m+"m" : m+"m";
  }

  // --- the active window ------------------------------------------------------
  // Two framings of one block, because which one is the constraint depends on
  // the day: TOKENS is spend against a budget (and the budget may be a guess --
  // see budgetSource), WINDOW is time against the reset, which is a fact. The
  // choice is the viewer's and survives the 60s reload.
  var VIEWS = ["tokens", "window"];
  // Default follows the billing model: with no window limit to be a share of,
  // the useful thing in this card is the clock and the burn rate. An explicit
  // choice still wins.
  var view = D.billing === "usage" ? "window" : "tokens";
  try { var s = localStorage.getItem("crew.usage.blockView");
        if (VIEWS.indexOf(s) >= 0) view = s; } catch (e) {}

  var winLabel = function(min){
    min = min || 300;
    var h = Math.floor(min/60), m = min%60;
    return (h ? h + "h" : "") + (m ? (h ? " " : "") + m + "m" : "") + " window";
  };
  // Minutes left computed from the block's own end time, not the server's
  // remainingMinutes: the snapshot is written once and the tab can sit open.
  var leftMin = function(bk){
    if (bk && bk.endTime) {
      var ms = new Date(bk.endTime).getTime() - Date.now();
      if (!isNaN(ms)) return Math.max(0, ms / 60000);
    }
    return (bk && bk.remainingMinutes) || 0;
  };

  var usd = function(n){
    n = n || 0;
    if (n >= 1000) return "$" + Math.round(n).toLocaleString();
    if (n >= 100) return "$" + n.toFixed(0);
    return "$" + n.toFixed(2);
  };

  var b = D.block, out = "";
  var wlab = winLabel((b && b.windowMinutes) || D.windowMinutes);

  // --- the month, when the month is the constraint --------------------------
  // On usage-based billing there is no window limit to be a share of: you are
  // billed, not throttled. So this leads, and the window card below it drops to
  // burn-rate duty. The track is elapsed days, the fill is spend -- putting the
  // two on one bar is the whole question ("am I ahead of the month or behind").
  var M = D.month;
  if (D.billing === "usage" && M) {
    var mpct = M.budget > 0 ? M.spent / M.budget * 100 : 0;
    var dayPct = M.daysInMonth > 0 ? M.daysElapsed / M.daysInMonth * 100 : 0;
    var over = M.budget > 0 && M.projected > M.budget;
    out += '<div class="card">' +
      '<div class="hd"><h2>' + esc(M.label) + "</h2><span class=\"when\">day " +
        M.daysElapsed + " of " + M.daysInMonth + "</span></div>" +
      '<div class="hero">' + (M.budget > 0 ? mpct.toFixed(0) + "%" : usd(M.spent)) +
        "<small>" + (M.budget > 0 ? "of " + usd(M.budget) : "this month") + "</small></div>" +
      '<div class="bullet"><i style="width:' + Math.min(100, M.budget > 0 ? mpct : dayPct).toFixed(1) + '%"></i></div>' +
      '<div class="foot"><span>' + usd(M.spent) + " spent</span>" +
      "<span>" + dayPct.toFixed(0) + "% of the month gone</span>" +
      "<span>" + (M.projected ? (over ? "↗ " : "→ ") + usd(M.projected) + " by month end" : "") + "</span>" +
      "</div></div>";
  }

  function blockBody(mode){
    if (!b) return "";
    if (mode === "window") {
      var total = (b.windowMinutes || D.windowMinutes || 300);
      var left = leftMin(b);
      var elapsed = Math.max(0, total - left);
      var ePct = total > 0 ? elapsed / total * 100 : 0;
      var burn = Math.round(b.burnPerMinute || 0);
      return '<div class="hero">' + dur(left) + "<small>to reset</small></div>" +
        '<div class="bullet"><i style="width:' + Math.min(100, ePct).toFixed(1) + '%"></i></div>' +
        '<div class="foot"><span>' + dur(elapsed) + " of " + wlab.replace(" window", "") + " elapsed</span>" +
        "<span>" + tok(b.tokens) + " so far</span>" +
        "<span>" + (burn ? tok(burn) + "/min" : esc((b.models||[]).join(", "))) + "</span></div>";
    }
    // With no budget env var and nothing on record there is no denominator, and
    // a confident "0%" reads as "you have used nothing" rather than "nobody
    // knows". Say so, and let the time view carry the card.
    if (!(b.budget > 0)) {
      return '<div class="hero">' + tok(b.tokens) + "<small>this window</small></div>" +
        '<div class="bullet"><i style="width:0%"></i></div>' +
        '<div class="foot"><span>no budget on record</span>' +
        "<span>" + (b.entries||0) + " msgs</span>" +
        '<span>set CREW_BLOCK_BUDGET, or switch to time</span></div>';
    }
    var pct = pctOf(b.tokens, b.budget);
    var projPct = pctOf(b.projected, b.budget);
    return '<div class="hero">' + pct.toFixed(0) + "%<small>of window budget</small></div>" +
      '<div class="bullet"><i style="width:' + Math.min(100, pct).toFixed(1) + '%"></i></div>' +
      '<div class="foot"><span>' + tok(b.tokens) + " / " + tok(b.budget) + "</span>" +
      "<span>" + (b.entries||0) + " msgs</span>" +
      "<span>" + (projPct > pct ? "↗ " + projPct.toFixed(0) + "% by reset" : esc((b.models||[]).join(", "))) + "</span>" +
      "</div>";
  }

  if (b) {
    out += '<div class="card">' +
      '<div class="hd"><h2>' + esc(wlab) + "</h2>" +
      '<button class="tbtn" id="vtoggle" aria-label="switch the window card between tokens and time"></button>' +
      '<span class="when" id="vwhen"></span></div>' +
      '<div id="blockbody">' + blockBody(view) + "</div>" +
      "</div>";
  } else {
    out += '<div class="card"><div class="hd"><h2>' + esc(wlab) + "</h2></div>" +
      '<div class="empty">quiet — no active window. Budget ' + tok(D.blockBudget) +
      " (" + esc(D.budgetSource||"") + ")</div></div>";
  }

  // --- daily -----------------------------------------------------------------
  var days = D.daily || [];
  // One unit per page: if the month above is money, these bars are money too.
  // Mixing "tokens here, dollars there" makes the eye compare two shapes that
  // are not the same measure.
  var money = D.billing === "usage";
  var val = function(d){ return money ? (d.cost || 0) : (d.tokens || 0); };
  var fmtVal = function(n){ return money ? usd(n) : tok(n); };
  var unit = money ? "" : " tokens";
  if (days.length) {
    var max = Math.max.apply(null, days.map(val)) || 1;
    var peak = days.reduce(function(a,c){ return val(c) > val(a) ? c : a; }, days[0]);
    var bars = days.map(function(d, i){
      var h = Math.max(1, val(d) / max * 100);
      // Only two labels, ever: the peak and the most recent day.
      var tagged = (d === peak) || (i === days.length - 1 && d !== peak);
      var tag = tagged ? '<span class="tag">' + fmtVal(val(d)) + "</span>" : "";
      return '<div class="col" tabindex="0" data-i="' + i + '" role="img" aria-label="' +
        esc(d.period) + ": " + fmtVal(val(d)) + unit + '">' + tag +
        '<i style="height:' + h.toFixed(1) + '%"></i></div>';
    }).join("");
    out += '<div class="card">' +
      '<div class="hd"><h2>Daily · last ' + days.length + "</h2>" +
      '<button class="tbtn" id="toggle" aria-expanded="false">table</button></div>' +
      '<div class="plot" id="plot">' +
        '<div class="grid" style="top:0"></div><div class="grid" style="top:50%"></div>' +
        bars +
      "</div>" +
      '<div class="axis"><span>' + esc(days[0].period.slice(5)) + "</span>" +
      "<span>peak " + fmtVal(max) + "</span>" +
      "<span>" + esc(days[days.length-1].period.slice(5)) + "</span></div>" +
      '<table id="tbl" hidden><thead><tr><th>Day</th><th>' + (money ? "Cost" : "Tokens") + "</th></tr></thead><tbody>" +
        days.slice().reverse().map(function(d){
          return "<tr><td>" + esc(d.period) + "</td><td>" +
            (money ? usd(d.cost) : (d.tokens||0).toLocaleString()) + "</td></tr>";
        }).join("") +
      "</tbody></table></div>";
  }

  // --- the week -----------------------------------------------------------------
  // Same bullet grammar as the window card: track = weekly budget (largest week
  // on record, or CREW_WEEK_BUDGET), fill = this week so far.
  if (D.week) {
    var wp = pctOf(D.week.tokens, D.week.budget);
    out += '<div class="card">' +
      // On usage billing there is no weekly allowance to be a share of, so the
      // week is simply what it cost. The bar would have no track, so it goes.
      '<div class="hd"><h2>' + esc(D.week.label) + '</h2><span class="when">' +
        (money ? tok(D.week.tokens) + " tokens" : tok(D.week.budget) + " budget") + "</span></div>" +
      (money
        ? '<div class="hero">' + usd(D.week.cost) + "<small>this week</small></div>"
        : '<div class="hero">' + wp.toFixed(0) + "%<small>" + tok(D.week.tokens) + " tokens</small></div>" +
          '<div class="bullet"><i style="width:' + Math.min(100, wp).toFixed(1) + '%"></i></div>') +
      // One model means the list would just repeat the hero figure underneath it.
      // Name the model instead; show the split only when there is a split.
      ((D.week.models||[]).length === 1
        ? '<ul class="models"><li><span>' + esc(D.week.models[0].name) + "</span></li></ul>"
        : '<ul class="models">' + (D.week.models||[]).map(function(m){
            return "<li><span>" + esc(m.name) + "</span><b>" + tok(m.tokens) + "</b></li>";
          }).join("") + "</ul>") + "</div>";
  }

  // --- per-workspace dollars ---------------------------------------------------
  // The page's one deliberate exception to tokens-only (see the header note):
  // this section is explicitly about money. Bars share one scale — the biggest
  // 7-day spender — in the page's single data hue.
  if ((D.costs||[]).length) {
    var cmax = Math.max.apply(null, D.costs.map(function(c){ return c.week; })) || 1;
    var usd = function(n){ return "$" + (n >= 100 ? Math.round(n) : (n||0).toFixed(2)); };
    out += '<div class="card">' +
      '<div class="hd"><h2>Per workspace · $</h2><span class="when">7 days</span></div>' +
      '<ul class="wcosts">' + D.costs.map(function(c){
        return '<li><span class="nm">' + esc(c.name) + "</span>" +
          '<span class="bar"><i style="width:' + Math.min(100, c.week / cmax * 100).toFixed(1) + '%"></i></span>' +
          '<b>' + usd(c.today) + ' today · ' + usd(c.week) + '</b></li>';
      }).join("") + "</ul>" +
      '<div class="foot"><span>ccusage dollars, ~5min cache · subagent/cloud sessions may be missing</span></div>' +
      "</div>";
  }

  app.innerHTML = out;

  // --- hover / focus ----------------------------------------------------------
  // Enhances; it never gates. Every value is in the table twin and on the
  // element's aria-label, and focus shows exactly what hover shows.
  var plot = document.getElementById("plot");
  if (plot) {
    var show = function(el){
      var d = days[+el.getAttribute("data-i")];
      tip.innerHTML = esc(d.period) + " &nbsp; <b>" + fmtVal(val(d)) + "</b><br>" +
        (money ? usd(d.cost) + " · " + tok(d.tokens) + " tokens"
               : (d.tokens||0).toLocaleString() + " tokens");
      tip.style.opacity = 1;
      var r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
      var left = Math.min(window.innerWidth - t.width - 6, Math.max(6, r.left + r.width/2 - t.width/2));
      tip.style.left = left + "px";
      tip.style.top = Math.max(6, r.top - t.height - 6) + "px";
    };
    var hide = function(){ tip.style.opacity = 0; };
    plot.addEventListener("mouseover", function(e){ var c = e.target.closest(".col"); if (c) show(c); });
    plot.addEventListener("mouseleave", hide);
    plot.addEventListener("focusin", function(e){ var c = e.target.closest(".col"); if (c) show(c); });
    plot.addEventListener("focusout", hide);
  }
  // --- window card: tokens <-> time -------------------------------------------
  // The button names the view you would switch TO, matching the table toggle
  // below. The "when" line always shows the other measure, so neither view
  // hides the number the other one leads with.
  var vt = document.getElementById("vtoggle"), vbody = document.getElementById("blockbody");
  if (vt && vbody) {
    var paint = function(){
      vt.textContent = view === "tokens" ? "time" : "tokens";
      var when = document.getElementById("vwhen");
      if (when) when.textContent = view === "tokens"
        ? dur(leftMin(b)) + " to reset"
        : (b.budget > 0 ? pctOf(b.tokens, b.budget).toFixed(0) + "% of budget"
                        : tok(b.tokens) + " this window");
      vbody.innerHTML = blockBody(view);
    };
    paint();
    vt.addEventListener("click", function(){
      view = view === "tokens" ? "window" : "tokens";
      try { localStorage.setItem("crew.usage.blockView", view); } catch (e) {}
      paint();
    });
    // The clock moves even when nothing else does; the 60s reload would cover
    // it, but a countdown that only updates on reload reads as frozen.
    setInterval(paint, 15000);
  }

  var t = document.getElementById("toggle"), tbl = document.getElementById("tbl");
  if (t) t.addEventListener("click", function(){
    var open = tbl.hidden;
    tbl.hidden = !open;
    t.setAttribute("aria-expanded", String(open));
    t.textContent = open ? "chart" : "table";
    document.getElementById("plot").hidden = open;
    document.querySelector(".axis").hidden = open;
  });

  // The server holds no cache; a reload is a fresh ccusage read.
  setInterval(function(){ location.reload(); }, 60000);
})();
</script>
</body></html>
