<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>crew · who needs you</title>
<!--
  Inert by design. There is deliberately no script tag in this file: render.js is pushed
  with every update via `cmux browser addscript`, because a resident window.render was
  found to be unreachable from a pushed script (isolated world), while the DOM is shared.
  board_probe.mjs asserts both that absence and the five ids below.

  The contract with render.js, and nothing more:
    #rows    innerHTML target; also carries data-prev for cross-push ripple memory
    #need    "N need you" / "nothing needs you"; .on while anything does
    #quiet   the collapsed tail
    #src     where the snapshot came from
    #stamp   when
    #cat     the whimsy sprite; render.js sets its mood class, nothing else
    #tally   how many rows are broken, working and waiting to close
    #says    what the cat has to say about that mood
    #news    the news footer, a <details> render.js never replaces -- so its open
             state survives every push; render.js sets .hidden and fills
             #news-ttl (the window), #news-lede (the first sentence, shown
             collapsed) and #news-body (every sentence, by tier: .ni + tier)

  The cat's geometry lives HERE rather than in render.js on purpose: it is static art
  that never varies with the data, and render.js is re-sent on every single push. Only
  the mood class crosses the wire. The sprite itself is GENERATED -- run
  board/cat_from_swift.py to re-read the poses out of sidebars/crew.swift.

  Moods render.js sets on #cat, matching crew.swift's catMood():
    swat  a human is being waited on      nap  nothing is happening
    pace  anything working or broken

  Classes render.js emits: .row + .attend/.running/.wilt/.done/.quiet + .ripple,
  .enter (a row that was not on the previous push), .up/.down (a row that changed
  position, animated with the Web Animations API rather than CSS),
  .top > svg.dial + .own + .nm + .badge, .said (may contain <b> and <code>),
  .feed > .feedbar, .chips > .chip (+ .pri, the one filled button; + .sig, an
  actionable signal), .foot > .branch/.dirty/.pr/.issue/.sig/.meta/.cost,
  .owned + .here, .empty, .sect, .fam + .kid on a deep-plan family's rows, and a
  .famhd label before a family whose parent has no row.
  Palette is Everforest, matching render.js's COL map; the signals carry the Swift
  sidebar's palette instead, which the collector supplies per entry and render.js
  lifts until it reads on a card.
-->
<style>
/* Every colour that is ever a `color:` below is a token here, and
   board_probe.mjs measures each one against every ground: 4.5:1 or the probe
   fails. The old board lost its meta line this way -- #5c6a72 on a card is
   1.9:1 -- and nothing noticed. */
:root{
  /* Grounds: the page, a card, an attend card. */
  --bg:#2d353b; --bg1:#343f44; --bg-attend:#3b4136;
  --bg2:#3d484d; --line:#414b50; --edge:#56636a;
  /* Text. fg names things, fg2 is what an agent said, grey is everything around it. */
  --fg:#d3c6aa; --fg2:#b8b0a0; --grey:#a3ada5;
  /* Tiers. The rail, the dial and the filled button wear these. Wilt's red is
     3.9:1 on a card, so where it is text it uses its lighter twin. */
  --attend:#dfa000; --running:#7fbbb3; --wilt:#e67e80; --done:#a7c080; --quiet:#7a8478;
  --wilt-tx:#f0a0a0;
  /* The footer's own colours: an open PR, a linked issue, uncommitted work. */
  --pr-open:#4ADE80; --issue:#b9a5fb; --dirty:#F5A524;
  /* Text on a filled button, measured against each tier colour instead. */
  --ink:#1e2326;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
/* No padding on top: the sticky header owns the top edge. With padding here the
   header started 11px down and a sliver of page background sat above the cat's
   shelf -- the negative side margins below cancel the LEFT and RIGHT padding, and
   nothing was cancelling this one. */
/* A column at least the pane's height, so the news footer's margin-top:auto
   lands it on the bottom edge even when the board is two rows long. */
body{display:flex;flex-direction:column;min-height:100vh;
  padding:0 11px 11px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

/* Parked at the top: the board is a list you scroll, and the one thing you always
   want in view is what is waiting on you. Negative side margins cancel the body's
   padding so the bar -- and the cat's shelf inside it -- reach both edges. */
header{position:sticky;top:0;z-index:5;background:var(--bg);
  margin:0 -11px 9px;padding:0 11px 5px;border-bottom:1px solid var(--line)}

/* Two lines under the shelf. The first answers the board's question: the
   headline, then what else is going on, counted. The second is the cat talking,
   with the timestamp at its end. Both wrap rather than collide: nothing here is
   worth printing on top of anything else. */
.hud{display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap;min-width:0}
#need{font:700 11.5px/1.35 system-ui;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg);white-space:nowrap;flex:none}
#need.on{color:var(--attend)}
.hud2{display:flex;align-items:baseline;gap:8px;margin-top:1px;min-width:0}
.right{display:flex;gap:8px;align-items:baseline;font:500 10.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--grey);white-space:nowrap;margin-left:auto;flex:none}

/* --- the cat ----------------------------------------------------------- */
/* The crew sidebar's tuxedo cat, ported pixel-for-pixel by cat_from_swift.py --
   the poses are read out of crew.swift, not redrawn. Its three moods and every
   timing below come from that file too:

     catMood()   2 swat (a human is waited on) / 1 pace (anything working) / 0 nap
     frames      A and B alternate at 1Hz; nap breathes on a 6s cycle instead
     catX()      a triangle wave, 5px a second, 16s for the round trip
     catFlip()   turns around at the halfway point, mirroring about x=8.5 cells
     catLunge()  swat jerks 3px forward on alternate seconds
     catBob()    pace bobs 1px; nap rises 0,1,2,1 over 8s

   All of it is CSS, because the page is inert and pushes are two minutes apart:
   a 1Hz sprite cannot be driven by the renderer. render.js sets ONE class.
   Whimsy's rule still holds -- nap is the resting state and its only motion is a
   slow breath and the z's, which is what "nothing is happening" should look like. */
/* The shelf spans the bar edge to edge; the cat is positioned along it, so the
   walk covers the whole width instead of a 35px stub. It also keeps the palette
   honest -- catColor()'s charcoal body was chosen against a near-black ground and
   is LIGHTER than this board's, so without the plinth only the white bib reads. */
#shelf{position:relative;height:30px;margin:0 -11px 4px;overflow:hidden;
  background:#1e2326;box-shadow:inset 0 -1px 0 0 #171c1f}
#cat{position:absolute;left:0;bottom:0;height:30px;width:auto;overflow:visible}
#cat .pose{visibility:hidden}

/* A and B, one second each. steps(1) makes it a cut, not a crossfade: this is
   pixel art and a tween would blur it. */
@keyframes fa{0%,49.99%{visibility:visible}50%,100%{visibility:hidden}}
@keyframes fb{0%,49.99%{visibility:hidden}50%,100%{visibility:visible}}
#cat.swat .swat-a,#cat.pace .walk-a{animation:fa 2s steps(1,end) infinite}
#cat.swat .swat-b,#cat.pace .walk-b{animation:fb 2s steps(1,end) infinite}
/* A sleeping cat breathes slower than a walking one strides. */
#cat.nap .nap-a{animation:fa 6s steps(1,end) infinite}
#cat.nap .nap-b{animation:fb 6s steps(1,end) infinite}

/* The walk: out along the shelf and back, stepping rather than gliding, because
   a pixel cat that slides looks like a decal. */
/* left, not transform: the distance is "the width of the shelf minus the cat",
   which only exists as a percentage. A transform percentage is relative to the
   element's own box and would always be the same few pixels. */
@keyframes pace{from{left:0}to{left:calc(100% - 70px)}}
@keyframes bobwalk{0%,49.99%{transform:translateY(0)}50%,100%{transform:translateY(1px)}}
@keyframes bobnap{0%,24.9%{transform:translateY(0)}25%,49.9%{transform:translateY(1px)}
  50%,74.9%{transform:translateY(2px)}75%,100%{transform:translateY(1px)}}
@keyframes lunge{0%,49.99%{transform:translateX(0)}50%,100%{transform:translateX(3px)}}
#cat.pace{animation:pace 8s steps(9,end) infinite alternate}
#cat.pace .walker{animation:bobwalk 2s steps(1,end) infinite}
#cat.nap .walker{animation:bobnap 8s steps(1,end) infinite}
#cat.swat .walker{animation:lunge 2s steps(1,end) infinite}

/* Turning around. Mirrored about x=8.5 cells (25.5px), which is what
   `flip ? 17 - p[0] : p[0]` does in crew.swift. */
@keyframes face{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
#cat .facing{transform-box:view-box;transform-origin:25.5px 0}
#cat.pace .facing{animation:face 16s steps(1,end) infinite}

/* Three z's, drifting up and fading on staggered phases. */
#cat .zz{fill:#8BA3C7;font:italic 700 8px/1 system-ui;opacity:0}
#cat .z1{font-size:10px} #cat .z2{font-size:12px}
@keyframes drift{0%{opacity:.75;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-12px)}}
#cat.nap .zz{animation:drift 6s linear infinite}
#cat.nap .z1{animation-delay:2s} #cat.nap .z2{animation-delay:4s}

/* How many things are broken, working and waiting to close -- folded onto the
   headline's line, which already says how many need you. Quiet is not counted
   here either: the "quiet · N" divider in the list says it where it applies.
   Only non-zero states appear: the absence of "broken" reads faster than
   "0 broken". */
#tally{display:inline-flex;flex-wrap:wrap;gap:2px 9px;
  font:500 11px/1.35 system-ui;color:var(--grey)}
#tally:empty{display:none}
.tl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.tl b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.tl.wilt{--dot:var(--wilt)} .tl.running{--dot:var(--running)} .tl.done{--dot:var(--done)}
.tl.attend{--dot:var(--attend)} .tl.quiet{--dot:var(--quiet)}

/* What the cat has to say about it. A sentence, so it is set like one: full
   strength, full size, clipped only when the Dock is too narrow for it. */
#says{flex:1;font:italic 11.5px/1.35 system-ui;color:var(--fg2);white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}

/* --- a card ------------------------------------------------------------ */
/* One rail, and it says the tier. The worktree's own colour used to be a second
   stripe beside it; two stripes read as one thick smudge at Dock width, so the
   identity colour is a dot beside the name now (.own). --c is the tier colour
   the rail, the badge and the filled button all read. */
.row{--c:var(--quiet);position:relative;background:var(--bg1);
  border-left:4px solid var(--c);border-radius:9px;padding:9px 10px 9px 9px;margin-bottom:7px}
.row.attend{--c:var(--attend);background:var(--bg-attend)}
.row.running{--c:var(--running)}
.row.wilt{--c:var(--wilt)}
.row.done{--c:var(--done)}

.top{display:flex;align-items:center;gap:7px;min-width:0}
.dial{flex:none;width:26px;height:26px}
.own{flex:none;width:8px;height:8px;border-radius:50%;background:var(--own)}
.nm{flex:1;min-width:0;font:600 13.5px/1.3 system-ui;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font:700 10px/1.3 system-ui;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grey);white-space:nowrap}
.attend .badge{color:var(--attend)} .running .badge{color:var(--running)}
.wilt .badge{color:var(--wilt-tx)} .done .badge{color:var(--done)}

/* What the agent said: proportional, because it is a sentence, and two lines at
   most, because the card's job is to say what is next and the rest is a click
   away. */
.said{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--fg2);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word}
.said b{color:var(--fg);font-weight:600}
.said code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--running)}

/* Where you are standing. A ring in the worktree's OWN colour, so the card, the
   VS Code title bar and the pane frame are all wearing the same hex. The card's
   ground does not change: a lighter ground was the one place text fell under
   4.5:1. Falls back to grey when a workspace has no colour set. */
.row.here{box-shadow:0 0 0 2px var(--own,var(--grey))}

/* --- the button row ---------------------------------------------------- */
/* Every target is at least 28px tall: these are things you click while doing
   something else. The first chip is the one that resolves the row, and on the
   tiers that ask something of you -- attend, wilt, done -- it is filled. A
   working card asks nothing, so everything on it stays a ghost; filling every
   card's first button turned the board into a wall of colour. Actionable
   signals (CI, allow, deny, a ticket) join the row as ghosts in their own
   colour. Labels stay bare text: intent.js reads a chip's verb off its label. */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border-radius:7px;
  border:1px solid var(--edge);background:transparent;color:var(--fg);
  font:600 12.5px/1 system-ui;white-space:nowrap;user-select:none;-webkit-user-select:none}
.chip.pri{background:var(--c);border-color:var(--c);color:var(--ink)}
.chip.sig{font-weight:500}

/* --- the footer -------------------------------------------------------- */
/* Branch, uncommitted work, PR, issue, status signals, progress, spend: the
   facts you recognise a row by, in one mono line that wraps. The links are
   24px tall -- smaller than a button, still a target -- and underlined, because
   that is what says "this opens something". Status signals are plain text in
   their own colour and do not react. */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:0 9px;margin-top:6px;min-width:0;
  font:11.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--grey);
  font-variant-numeric:tabular-nums}
.foot>span{min-height:24px;line-height:24px;white-space:nowrap;min-width:0;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.branch,.pr,.issue{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px}
.branch{color:var(--fg2);text-decoration-color:var(--edge)}
.branch:hover{color:var(--fg);text-decoration-color:var(--fg)}
.pr{color:var(--grey);text-decoration-color:currentColor}
.pr.open{color:var(--pr-open)}
.issue{color:var(--issue);text-decoration-color:currentColor}
.pr:hover,.issue:hover{filter:brightness(1.25)}
.dirty{color:var(--dirty);font-size:9px}
.cost{margin-left:auto;color:var(--fg2)}
.cost.small{color:var(--grey)}

/* --- the reply window -------------------------------------------------- */
/* The animation's DURATION is the time remaining, set inline per row, so the
   bar drains in real time and empties exactly when the window closes. No
   resident timer, and nothing to go stale between pushes. */
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.feed{margin-top:7px;height:3px;border-radius:2px;background:var(--bg2);overflow:hidden}
.feedbar{display:block;height:100%;border-radius:2px;background:#F5A524;
  transform-origin:left center;animation:drain linear 1 forwards}

/* --- a quiet row ------------------------------------------------------- */
/* One line: the dot, the name, then its ghost buttons (diff, pr) or, with none,
   its badge -- and no badge at all when it has none. No dial, no said, no
   footer: the whole row is the target and it selects the workspace. Recessed by losing the card's fill, not by fading: an opacity
   dim took the name under 4.5:1. */
.row.quiet{background:transparent;border:1px solid var(--line);border-left:4px solid var(--c);
  padding:5px 10px 5px 9px;margin-bottom:5px}
.row.quiet .top{min-height:22px}
.row.quiet .chips{display:inline-flex;flex:none;flex-wrap:nowrap;gap:5px;margin:0}
.row.quiet .chip{padding:0 9px}
.row.quiet .nm{font-weight:500;font-size:13px;color:var(--fg2)}
.row.quiet .cost{margin-left:0;font:11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
.sect{color:var(--grey);font:600 10.5px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;
  margin:12px 0 5px;padding-top:8px;border-top:1px solid var(--line)}
/* A deep-plan family: the parent row leads, its children sit indented beneath
   it behind a thin elbow, so the group reads as one thing at one tier. */
.row.kid{margin-left:14px}
.row.kid::before{content:"";position:absolute;left:-14px;top:-8px;height:24px;width:9px;
  border-left:1px solid var(--edge);border-bottom:1px solid var(--edge);border-bottom-left-radius:4px}
.famhd{color:var(--grey);font:600 11px/1.3 system-ui;letter-spacing:.04em;margin:9px 0 4px 2px}

/* Fires once, on the transition into done -- render.js gates it with data-prev. */
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(167,192,128,.5)}100%{box-shadow:0 0 0 14px rgba(167,192,128,0)}}
.row.ripple{animation:ripple 900ms ease-out 1}

/* --- motion ------------------------------------------------------------- */
/* Reordering is animated from render.js with the Web Animations API, not from
   here: a FLIP needs the OLD offsetTop, which only exists before innerHTML is
   replaced, and .animate() runs from that measurement without the
   set-transform / force-reflow / clear-transform dance. What CSS owns is the
   accent that says WHY a row moved. */

/* A row that climbed the ranking earned a look. One pass of a ring in its own
   tier colour, brightest at the moment it arrives. Rows that sank get nothing:
   losing urgency is not news. */
@keyframes climb{0%{box-shadow:0 0 0 2px var(--c)}100%{box-shadow:0 0 0 2px transparent}}
.row.up{animation:climb 900ms ease-out 1}

/* Pending. A gate nobody has opened, a question nobody has answered: the one
   button that would resolve it breathes a halo. Exactly one element per row
   moves, only on rows that are actually waiting on a human, and the button
   itself never fades -- its label stays at full contrast. */
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(223,160,0,0)}
  50%{box-shadow:0 0 0 4px rgba(223,160,0,.22)}}
.row.attend .chip.pri{animation:breathe 2.2s ease-in-out infinite}

/* Mid-turn with no measurable progress: an indeterminate sweep on the dial,
   which is the honest shape for "working, cannot say how far". A dial WITH a
   percentage does not spin -- it already answers the question. */
@keyframes sweep{to{transform:rotate(360deg)}}
.row.running .dial.pending .arc{transform-origin:16px 16px;animation:sweep 1.9s linear infinite}
.row.wilt .dial.pending .arc{animation:none}

/* Everything above is decoration. If the reader has asked the OS for less
   motion, none of it is worth overriding that. */
@media (prefers-reduced-motion:reduce){
  #cat .tail,#cat .ear,#cat .eye,.row.up,.row.attend .chip.pri,
  .row.running .dial.pending .arc,.row.ripple{animation:none}
  #cat .eye{transform:none}
}

.empty{color:var(--grey);font-size:13px;line-height:1.6;padding:18px 4px;text-align:center}
.empty code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2)}
#quiet{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);
  color:var(--grey);font-size:12px}
#quiet:empty{display:none}

/* The news: pinned to the pane's bottom edge, one line until opened. Sticky
   rather than fixed, so it stays in the flow -- scrolled to the end, it sits
   after the last row instead of over it. Negative margins reach the edges and
   cancel the body's bottom padding, as the header does at the top. Nothing in
   it moves: it is read, not watched. */
#news{position:sticky;bottom:0;z-index:5;margin:auto -11px -11px;
  padding:6px 11px 8px;background:var(--bg);border-top:1px solid var(--line);
  max-height:45vh;overflow-y:auto}
#news[hidden]{display:none}
#news summary{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:24px;
  list-style:none;white-space:nowrap;overflow:hidden;color:var(--fg2);font-size:12px}
#news summary::-webkit-details-marker{display:none}
#news summary::before{content:"\25B8";color:var(--grey)}
#news[open] summary::before{content:"\25BE"}
#news-ttl{flex:none;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
#news-lede{overflow:hidden;text-overflow:ellipsis}
#news[open] #news-lede{display:none}
#news-lede b,#news-body b{color:var(--fg);font-weight:600}
#news-lede code,#news-body code{color:var(--running);font-size:11.5px}
#news-body{margin-top:5px}
.ni{margin:0 0 4px;padding-left:7px;border-left:2px solid var(--quiet);
  color:var(--fg2);font-size:12.5px;line-height:1.45}
.ni.attend{border-left-color:var(--attend)}
.ni.wilt{border-left-color:var(--wilt)}
.ni.running{border-left-color:var(--running)}
.ni.done{border-left-color:var(--done)}
</style></head>
<body>
<header>
  <!-- The shelf is the full width of the board and the cat walks the length of it.
       fa-cat / md-cat exist in cmux's icon set as font glyphs, but a glyph cannot
       flick its tail, so the cat is drawn here instead. -->
  <div id="shelf">
<!-- CAT:BEGIN generated by cat_from_swift.py -->
    <svg id="cat" class="nap" viewBox="0 0 90 39" aria-hidden="true">
