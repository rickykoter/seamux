<title>crew · who needs you</title>
<!--
  Inert by design. There is deliberately no script tag in this file: render.js is pushed
  with every update via `cmux browser addscript`, because a resident window.render was
  found to be unreachable from a pushed script (isolated world), while the DOM is shared.
  board_probe.mjs asserts both that absence and the five ids below.

  The contract with render.js, and nothing more:
    #rows    innerHTML target; also carries data-prev for cross-push ripple memory
    #need    "N need you" / "nothing needs you"; .on while anything does
    #quiet   the collapsed tail
    #src     where the snapshot came from
    #stamp   when
    #cat     the whimsy sprite; render.js sets its mood class, plus at most one
             reaction (hop / stretch / perk) for the push that caused it;
             intent.js sets data-sprite from the app's selected message
    #shelf   the cat's shelf; render.js sets data-sky (dawn / day / dusk /
             night) from the local hour, and data-sky-first on a page's first
             push so that sky appears at once instead of fading in
    #tally   how many rows are broken, working and waiting to close
    #says    what the cat has to say about that mood
    #news    the notification log's footer, a <details> render.js never
             replaces -- so its open state survives every push; render.js sets
             .hidden and fills #news-ttl, #news-lede (the newest entry, shown
             collapsed) and #news-body (every entry: .ni + tier, .skip when
             it was not shown); intent.js jumps on a click

  The cat's geometry lives HERE rather than in render.js on purpose: it is static art
  that never varies with the data, and render.js is re-sent on every single push. Only
  the mood class crosses the wire. The sprites themselves are GENERATED: edit
  board/sprites/*.json and run `seamux sprites` to rewrite the SPRITES block.

  Moods render.js sets on #cat (crew.swift's catMood() named them):
    swat  a human is being waited on      nap  nothing is happening
    pace  anything working or broken

  Classes render.js emits: .row + .attend/.running/.wilt/.done/.quiet + .ripple,
  .enter (a row that was not on the previous push), .up/.down (a row that changed
  position, animated with the Web Animations API rather than CSS),
  .top > svg.dial + .nm + .badge (framed by the app, .bs holds the badge and
  the ⋯), .said (may contain <b> and <code>, and on an attend card a leading
  .rsn, its reason),
  .feed > .feedbar, .pns > .pn (a pane, data-a="pane": + .agent or .term and
  its state, .wait/.work/.idle/.end/.unk/.sh, holding .pg, .pk, .pw and
  .ptag.plan/.outside), .chips > .chip (+ .pri, the one filled button; + .sig, an
  actionable signal, + .acc when the collector sent it amber; + .pane on a muted card, its panes' tags), .foot > .branch/.dirty/.pr/.issue/.sig/.meta and
  .end > .cost (the spend, held at the right end; also at the end of a quiet
  row's .top),
  .owned + .here, .empty, .sect, and for a deep-plan family: .fam on its card,
  .kids > .row.kid for each child, holding .top.kidhd > .caret, an optional
  .said.nest, and .kbody (the child's full card); .badge.roll on the card that
  counts them; .row.shell for a family whose parent has no row.
  Every row carries data-k, its tier. A row with a workspace has a .top.jumps,
  data-a="jump"; a row with none has a plain .top.
  A row with something to fold is .fd (+ .open when unfolded): its .top starts
  with button.caret (data-a="fold"), and with no workspace the .top is
  data-a="fold" too; what folds away is .fold (.kbody on a child);
  .top > .chip.fq is the filled chip a folded loud card keeps on its header.

  #rows also carries data-fold, id -> [open, tier] for the cards folded or
  unfolded by hand. intent.js writes it on a click; render.js reads it and
  drops ids that left the board or changed tier.
  Palette is Everforest, matching render.js's COL map; the signals carry the Swift
  sidebar's palette instead, which the collector supplies per entry and render.js
  lifts until it reads on a card.
-->

  /* roles: what a colour means, the same on every surface. A page maps its
     own names onto these and never picks a hue for a state itself. Each state
     has a fill (rings, dots, borders: 3:1) and a word colour (-t: 4.5:1).

  --role-line: var(--ef-line); --role-edge: var(--ef-line2);
  --role-primary: var(--ef-fg); --role-on-primary: var(--ef-ink);
  --role-link: var(--ef-text-accent); --role-focus: var(--ef-accent);
  /* terminal: the app's terminals draw with these in every mode, whatever a
     cmux or Ghostty config names (that config sets only the font). Ground,
     words, cursor and selection, then the 16 ANSI slots (0-7 black, red,
     green, yellow, blue, magenta, cyan, white; 8-15 their brights). Dark is
     Ghostty's Everforest Dark Hard. Each slot a program prints words in is
     4.5:1 or better on --term-bg (theme_sync.py --check); the slots it paints
     as grounds are held to nothing (TERM_GROUND_SLOTS). Six 256-colour
     slots keep their usual sense but take seamux's tints per mode, so a
     Claude theme on slots (seamux foam) gets tints that follow the flip:
     22 and 52 diff lines, 28 and 88 changed words (dark green and red),

  --ef-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  /* type scale: every page sizes words with these, never a px value of its own.
     1 meta, badges, labels (the floor: nothing smaller) · 2 secondary text, small UI
     3 body and UI default · 4 emphasis, card titles · 5 section and page titles
     6 the plan page's h1 alone */
  --fs-1: 11px; --fs-2: 12px; --fs-3: 13px; --fs-4: 15px; --fs-5: 18px; --fs-6: 22px;

/* The board's names for seamux's palette (theme/everforest.css). */
:root{
  /* Grounds: the page, a card, an attend card, a family's well of children. */
  --bg:var(--ef-bg); --bg1:var(--ef-bg1); --bg-attend:#3b4136; --bg-kids:#2a3135;
  --bg2:var(--ef-bg2); --line:#414b50; --edge:#56636a;
  /* Text. fg names things, fg2 is what an agent said, grey is everything around
     it. fg and fg2 are the roles' text and quiet text; grey stays the board's
     own, a touch lighter than --ef-text-faint, which is 4.4:1 on the attend ground. */
  --fg:var(--role-text); --fg2:var(--role-text-quiet); --grey:#a3ada5;
  /* Tiers: the colour roles (theme/everforest.css). The dial, the card's
     frame, dots and pips wear the fill; a badge or any other word wears the
     tier's word twin (-t), since a fill is held to 3:1 and words to 4.5:1.
     Quiet is the board's own: a resting grey, no role. */
  --attend:var(--role-attend); --running:var(--role-working); --wilt:var(--role-broken); --done:var(--role-done); --quiet:var(--ef-grey0);
  --attend-t:var(--role-attend-t); --running-t:var(--role-working-t); --wilt-tx:var(--role-broken-t); --done-t:var(--role-done-t);
  --focus:var(--role-focus);
  /* The footer's own colours: an open PR, a linked issue, uncommitted work.
     An open PR is the palette's green and uncommitted work its neutral text
     tier, both pointing into it, so light needs no copy of its own. The
     uncommitted mark stays away from attend's amber: it is not a call. */
  --pr-open:var(--ef-text-green); --issue:#b9a5fb; --dirty:var(--ef-text-dim);
  --link:var(--role-link);
  /* The one filled (primary) button, the same on every card and every page
     of the app: the primary role, a neutral, with its ink as the words.
     Amber is a status, never a button. */
  --pri:var(--role-primary); --ink:var(--role-on-primary);
  /* The dial's track is a graphic, not a ground: 2.5:1 on a card and 3:1 on
     the page, so the ring reads, while each tier's arc sits about 2:1 above it.
     Lifts and shades. Hover grounds sit under text (--gnd); the rest are
     washes over whatever ground is there. */
  --bg-hover:#2f3639; --bg-press:#374145; --bg-kid-hover:#323b40; --track:#727d76; --sel:#dbbc7f;
  --hover-a:rgba(255,255,255,.05); --hover-b:rgba(255,255,255,.07); --hover-c:rgba(255,255,255,.1);
  --hover-fg:rgba(211,198,170,.07); --shadow:rgba(0,0,0,.35);
  /* intent.js's: a delegated go chip, and the toast that says why a click failed. */
  --muted-edge:#4f585e; --muted-tx:#9da9a0; --toast-bg:#3a2a2c; --toast-tx:#f2d4d4;
  /* The confetti's pale bit. */
  --spark:#F5F5F7;
  /* The cat's shelf and its skies. Dark: the cat's charcoal was picked
     against a near-black ground. Light: pale skies, where the charcoal
     carries the cat. */
  --shelf:#1e2326; --shelf-edge:#171c1f;
  --sky-dawn:linear-gradient(#1f2330,#33282f); --sky-day:linear-gradient(#1d2a33,#22313a);
  --sky-dusk:linear-gradient(#22202b,#3a2b27); --sky-night:#13181c;
  --star:#c9c3b0; --star2:#8f8a7c;
  --orb:#8f8a7c; --orb-dawn:#e3c4a8; --orb-day:#efe6c8; --orb-dusk:#d9a99a; --orb-night:#cfc7b0;
  --zz:#8BA3C7;
}

   header started 11px down and a sliver of page background sat above the cat's
   shelf -- the negative side margins below cancel the LEFT and RIGHT padding, and
   nothing was cancelling this one. */
/* A column at least the pane's height, so the notifications footer's margin-top:auto
   lands it on the bottom edge even when the board is two rows long. */
body{display:flex;flex-direction:column;min-height:100vh;
  padding:0 11px 11px;font:var(--fs-3)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

/* Parked at the top: the board is a list you scroll, and the one thing you always
   want in view is what is waiting on you. Negative side margins cancel the body's
   padding so the bar -- and the cat's shelf inside it -- reach both edges. */
header{position:sticky;top:0;z-index:5;background:var(--bg);
  margin:0 -11px 6px;padding:0 11px 4px;border-bottom:1px solid var(--line)}

/* Two lines under the shelf. The first answers the board's question: the
   headline, then what else is going on, counted. The second is the cat talking,
   with the timestamp at its end. Both wrap rather than collide: nothing here is
   worth printing on top of anything else. */
.hud{display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap;min-width:0}
#need{font:700 var(--fs-2)/1.35 system-ui;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg);white-space:nowrap;flex:none}
#need.on{color:var(--attend-t)}
.hud2{display:flex;align-items:baseline;gap:8px;margin-top:1px;min-width:0}
.right{display:flex;gap:8px;align-items:baseline;font:500 var(--fs-1)/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--grey);white-space:nowrap;margin-left:auto;flex:none}
/* Where the board came from and when it last changed: there on hover, and
   always while it is stale, when the time is the news. */
header:not(:hover) .right:not(:has(#stamp.stale)){opacity:0}
.right{transition:opacity .15s}

/* --- the sprite -------------------------------------------------------- */
/* The shelf's sprite: one of five (tuxedo cat, sandy cat, penguin, owl, little
   robot), drawn on 2px cells, 24x15 cells a frame. Each is one generated sheet
   of the same 18 frames side by side (crew/board/sprites/*.json, written into
   the SPRITES block by `seamux sprites`), and the rules below step
   background-position through it. #cat's data-sprite picks the sheet; with
   none it is the tuxedo. The app sets it from the choice saved in the app.

     nap    breathes on a 6s cycle; one eye opens now and then, the tail flicks
     pace   walks in bursts: ~6s at 8 fps, then sits and looks about for 4s,
            three bursts out along the shelf and three back
     swat   a paw (wing, arm) at you, 4 times a second, and a blink now and then

   All of it is CSS, because the page is inert and pushes are two minutes apart.
   render.js sets ONE class. Whimsy's rule still holds -- nap is the resting
   state and its only motion is a slow breath and the z's, and pace rests
   between bursts, so an hour of work is not an hour of motion. */
/* The shelf spans the bar edge to edge and the sprite walks the length of it.
   The dark plinth keeps a charcoal sprite from vanishing into a near-black
   page; in light the plinth is pale and every sprite's outline reads on it. */
#shelf{position:relative;height:30px;margin:0 -11px 4px;overflow:hidden;
  background:var(--shelf);box-shadow:inset 0 -1px 0 0 var(--shelf-edge)}
/* Framed by an app that picks sprites, the shelf is a button for its Tray. */
#shelf[data-pick]{cursor:pointer}
#shelf[data-pick]:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
#cat{position:absolute;left:0;bottom:0;width:48px;height:30px}
#cat .facing,#cat .body,#cat .heart{position:absolute;inset:0}
#cat .facing{transform-origin:24px 0}
#cat .body,#cat .heart{background-repeat:no-repeat;background-size:864px 30px}
#cat .heart{background-position:-816px 0;visibility:hidden}

/* The sky. render.js reads the local hour at each push and sets #shelf
   data-sky: dawn 5-8, day 8-18, dusk 18-21, night otherwise. Each layer fades
   in over a minute when its turn comes, so the shelf drifts from one to the
   next rather than snapping -- except on a page's first push (data-sky-first),
   which should not open on a minute of bare plinth. In dark every sky stays
   dark: the cat's charcoal was picked against a near-black ground, and a pale
   sky there would leave only its white bib showing. In light the skies are
   pale and the charcoal is what reads (the --sky-* tokens). */
/* Each sky carries the shelf's bottom edge line itself: the layers cover
   #shelf's own inset shadow, and one of them is always opaque. */
#shelf .sky{position:absolute;inset:0;opacity:0;transition:opacity 60s linear;
  box-shadow:inset 0 -1px 0 0 var(--shelf-edge)}
#shelf[data-sky-first] .sky,#shelf[data-sky-first] .orb{transition:none}
.sky.dawn{background:var(--sky-dawn)}
.sky.day{background:var(--sky-day)}
.sky.dusk{background:var(--sky-dusk)}
.sky.night{background:var(--sky-night)}
#shelf[data-sky=dawn] .sky.dawn,#shelf[data-sky=day] .sky.day,
#shelf[data-sky=dusk] .sky.dusk,#shelf[data-sky=night] .sky.night{opacity:1}
/* Pixel stars: one 2px square, drawn many times by box-shadow, twinkling on a
   slow cycle. */
.stars{position:absolute;left:0;top:0;width:2px;height:2px;background:var(--star);
  box-shadow:31px 5px var(--star),74px 13px var(--star2),118px 4px var(--star),163px 17px var(--star2),
    205px 7px var(--star),251px 15px var(--star2),296px 3px var(--star),340px 11px var(--star2),
    388px 6px var(--star),431px 16px var(--star2),12px 18px var(--star2),142px 21px var(--star2)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
#shelf[data-sky=night] .stars{animation:twinkle 9s steps(3,end) infinite}
/* The sun, low at dawn and dusk and high by day, and the moon at night: a
   round 10px disc at the far end of the shelf, behind the cat, with a soft
   glow. Pale, never the amber of "needs you": a square amber sun read as one
   more status dot. */
.orb{position:absolute;right:22px;top:20px;width:10px;height:10px;border-radius:50%;
  background:var(--orb);opacity:0;transition:top 60s linear,background-color 60s linear,opacity 60s linear}
#shelf[data-sky=dawn] .orb{opacity:1;top:17px;background:var(--orb-dawn);box-shadow:0 0 6px 2px color-mix(in srgb,var(--orb-dawn) 45%,transparent)}
#shelf[data-sky=day] .orb{opacity:1;top:5px;background:var(--orb-day);box-shadow:0 0 6px 2px color-mix(in srgb,var(--orb-day) 45%,transparent)}
#shelf[data-sky=dusk] .orb{opacity:1;top:17px;background:var(--orb-dusk);box-shadow:0 0 6px 2px color-mix(in srgb,var(--orb-dusk) 45%,transparent)}
#shelf[data-sky=night] .orb{opacity:1;top:5px;background:var(--orb-night);box-shadow:inset -3px -1px 0 var(--sky-night)}

/* Each mood's resting frame: what shows before its timeline starts, and all
   that shows when motion is reduced. */
#cat .body{background-position:-144px 0}
#cat.pace .body{background-position:-336px 0}
#cat.swat .body{background-position:-528px 0}
/* The timelines (sp-*) are generated with the sheets; every step is held, a
   cut and not a tween, because a tween would blur pixel art. */
#cat.nap .body{animation:sp-nap 48s steps(1,end) infinite}
#cat.pace .body{animation:sp-pace 10s steps(1,end) infinite}
#cat.swat .body{animation:sp-swat 6s steps(1,end) infinite}
/* The walk along the shelf, in step with pace's bursts: left, not transform,
   since the distance is "the shelf minus the sprite", which only exists as a
   percentage. Turning around at the far end mirrors the sprite in place. */
#cat.pace{animation:sp-travel 60s linear infinite}
@keyframes face{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
#cat.pace .facing{animation:face 60s steps(1,end) infinite}

/* Three z's, drifting up and fading on staggered phases. */
#cat .zz{position:absolute;left:40px;bottom:12px;color:var(--zz);font:italic 700 var(--fs-1)/1 system-ui;opacity:0}
#cat .z1{left:45px;bottom:14px;font-size:var(--fs-2)} #cat .z2{left:51px;bottom:16px;font-size:var(--fs-3)}
@keyframes drift{0%{opacity:.75;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-12px)}}
#cat.nap .zz{animation:drift 6s linear infinite}
#cat.nap .z1{animation-delay:2s} #cat.nap .z2{animation-delay:4s}

/* Reactions. render.js compares this push with the last (data-prev) and adds
   ONE of these beside the mood, for one push:
     hop      a row just turned done: crouch, jump, land, and a heart rises
     stretch  the last thing that needed you is gone: one long stretch
     perk     a row newly needs you: ears up
   Each plays once, listed AFTER the mood's timeline: of two animations on one
   property the later wins while it runs, and when it ends the mood's own shows
   again, so nothing has to take the class off in time. */
#cat.nap.hop .body{animation:sp-nap 48s steps(1,end) infinite,sp-hop 1.6s steps(1,end) 1}
#cat.pace.hop .body{animation:sp-pace 10s steps(1,end) infinite,sp-hop 1.6s steps(1,end) 1}
#cat.swat.hop .body{animation:sp-swat 6s steps(1,end) infinite,sp-hop 1.6s steps(1,end) 1}
#cat.nap.perk .body{animation:sp-nap 48s steps(1,end) infinite,sp-perk 1.2s steps(1,end) 1}
#cat.pace.perk .body{animation:sp-pace 10s steps(1,end) infinite,sp-perk 1.2s steps(1,end) 1}
#cat.swat.perk .body{animation:sp-swat 6s steps(1,end) infinite,sp-perk 1.2s steps(1,end) 1}
#cat.nap.stretch .body{animation:sp-nap 48s steps(1,end) infinite,sp-stretch 2.4s steps(1,end) 1}
#cat.pace.stretch .body{animation:sp-pace 10s steps(1,end) infinite,sp-stretch 2.4s steps(1,end) 1}
#cat.swat.stretch .body{animation:sp-swat 6s steps(1,end) infinite,sp-stretch 2.4s steps(1,end) 1}
/* The heart rises while the sprite is in the air and fades as it lands. */
@keyframes heart{0%{visibility:visible;transform:translateY(0)}
  100%{visibility:visible;transform:translateY(-8px)}}
#cat.hop .heart{animation:heart 1.3s steps(4,end) .3s 1}
/* No z's over a sprite that is awake for a moment. The nap's drift keeps
   running underneath (its staggered delays intact); the z's are just clear
   for the reaction's length. */
@keyframes rxfill{0%,100%{color:transparent}}
#cat.nap.hop .zz{animation-name:drift,rxfill;animation-duration:6s,1.6s;
  animation-timing-function:linear,steps(1,end);animation-iteration-count:infinite,1}
#cat.nap.perk .zz{animation-name:drift,rxfill;animation-duration:6s,1.2s;
  animation-timing-function:linear,steps(1,end);animation-iteration-count:infinite,1}
#cat.nap.stretch .zz{animation-name:drift,rxfill;animation-duration:6s,2.4s;
  animation-timing-function:linear,steps(1,end);animation-iteration-count:infinite,1}
#cat.nap.hop .z1,#cat.nap.perk .z1,#cat.nap.stretch .z1{animation-delay:2s,0s}
#cat.nap.hop .z2,#cat.nap.perk .z2,#cat.nap.stretch .z2{animation-delay:4s,0s}

/* How many things are broken, working and waiting to close -- folded onto the
   headline's line, which already says how many need you. Quiet is not counted
   here either: the "quiet · N" divider in the list says it where it applies.
   Only non-zero states appear: the absence of "broken" reads faster than
   "0 broken". */
#tally{display:inline-flex;flex-wrap:wrap;gap:2px 9px;
  font:500 var(--fs-1)/1.35 system-ui;color:var(--grey)}
#tally:empty{display:none}
/* Shown while any card is open (render.js, intent.js): folds them all. */
#foldall{margin-left:auto;flex:none;align-self:center;background:none;border:0;padding:0 2px;cursor:pointer;
  font:500 var(--fs-1)/1.35 system-ui;color:var(--grey);text-decoration:underline;text-decoration-color:var(--edge);
  text-underline-offset:3px}
#foldall:hover,#foldall:focus-visible{color:var(--fg);text-decoration-color:currentColor}
/* Hidden, it keeps its room: the row wraps the same whether it shows or not,
   so opening or folding a card never moves the rows below. */
#foldall[hidden]{display:inline-block;visibility:hidden}
.tl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.tl b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.tl.wilt{--dot:var(--wilt)} .tl.running{--dot:var(--running)} .tl.done{--dot:var(--done)}
.tl.attend{--dot:var(--attend)} .tl.quiet{--dot:var(--quiet)}

/* What the cat has to say about it. A sentence, so it is set like one: full
   strength, full size, clipped only when the Dock is too narrow for it. */
#says{flex:1;font:italic var(--fs-2)/1.35 system-ui;color:var(--fg2);white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}

/* --- a card ------------------------------------------------------------ */
/* A card. No edge stripe: the tier is on the badge, the dial and the frame
   (--c), and the card that needs you keeps its tinted ground, the
   page's one loud thing. The worktree's own colour is the ring round the
   row you stand in, and only that: a dot beside the name or the branch
   read as one more state.
   The header is the jump (.top.jumps, render.js): the same target folded or
   not, its ground lifting on hover; a pressed header says how it went
   (.hit/.ok/.bad, intent.js). The caret folds.
   --gnd is the ground a row shows right now, for what sits over it.
   intent.js lifts a hovered row's ground, so --gnd follows it once
   intent.js has wired #rows. */
.row{--c:var(--quiet);--gnd:var(--bg1);position:relative;background:var(--bg1);
  border-radius:9px;padding:6px 9px;margin-bottom:4px}
.row.attend{--gnd:var(--bg-attend)} .row.quiet{--gnd:var(--bg)}
#rows[data-intent] .row:not(.inert):hover{--gnd:var(--bg-hover)}
.kids>.row.kid{--gnd:var(--bg-kids)}
#rows[data-intent] .kids>.row.kid:not(.inert):hover{--gnd:var(--bg-kid-hover)}
.top.jumps{cursor:pointer;border-radius:6px;margin:-3px -4px;padding:3px 4px}
.top.jumps:hover{background:var(--hover-a)}
.top.jumps.hit{background:var(--hover-c)}
.top.jumps.ok{box-shadow:inset 0 0 0 1px var(--done)}.top.jumps.bad{box-shadow:inset 0 0 0 1px var(--wilt)}

/* Folding. Every card's header (data-a="fold") folds it in place; .fold holds
   what goes away. Folded, a card that needs you keeps its first chip, filled,
   on the header line (.fq), and its own badge steps aside for the name -- a
   rolled-up family badge stays, it is the news. */
.row.fd:not(.open)>.fold{display:none}
.row.open>.top>.fq{display:none}
.row.fd:not(.open)>.top.loud>.badge:not(.roll),.row.fd:not(.open)>.top.loud>.bs>.badge:not(.roll){display:none}
.top>.fq{flex:none;padding:0 9px}
.row.attend{--c:var(--attend);background:var(--bg-attend)}
.row.running{--c:var(--running)}
.row.wilt{--c:var(--wilt)}
.row.done{--c:var(--done)}

.top{display:flex;align-items:center;gap:7px;min-width:0}
.dial{flex:none;width:26px;height:26px}
/* Folded, a card is its header line: a smaller dial keeps ten of them in one
   window's height. The caret and the header stay at least 24px tall. */
.row.fd:not(.open)>.top>.dial{width:22px;height:22px}
.nm{flex:1;min-width:0;font:600 var(--fs-3)/1.3 system-ui;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font:700 var(--fs-1)/1.3 system-ui;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grey);white-space:nowrap}
/* Each row colours its OWN badge (>.top>): a family card holds rows of other
   tiers, and a descendant rule painted an attend child's badge the parent's
   teal. */
/* A limit's pill is a phrase with a time in it ("back 2:04 PM"):
   set as words, not shouted, so it costs the name less room. */
.badge.lim{text-transform:none;letter-spacing:0;font:600 var(--fs-1)/1.3 system-ui}
.row.attend>.top>.badge,.row.attend>.top>.bs>.badge{color:var(--attend-t)}
.row.running>.top>.badge,.row.running>.top>.bs>.badge{color:var(--running-t)}
.row.wilt>.top>.badge,.row.wilt>.top>.bs>.badge{color:var(--wilt-tx)}
.row.done>.top>.badge,.row.done>.top>.bs>.badge{color:var(--done-t)}

/* What the agent said: proportional, because it is a sentence, and two lines at
   most, because the card's job is to say what is next and the rest is a click
   away. */
.said{margin:3px 0 0;font-size:var(--fs-3);line-height:1.4;color:var(--fg2);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word}
.said b{color:var(--fg);font-weight:600}
/* Why a card needs you, ahead of what it said: its badge says only that it does. */
.said .rsn{color:var(--fg);font-weight:600}
.said code{font:var(--fs-2) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--running-t)}

/* Where you are standing. A ring in the worktree's OWN colour, so the card, the
   VS Code title bar and the pane frame are all wearing the same hex. The card's
   ground does not change: a lighter ground was the one place text fell under
   4.5:1. Falls back to grey when a workspace has no colour set. */
.row.here{box-shadow:0 0 0 2px var(--own,var(--grey))}

/* --- the button row ---------------------------------------------------- */
/* Every target is at least 28px tall: these are things you click while doing
   something else. The first chip is the one that resolves the row, and on the
   tiers that ask something of you -- attend, wilt, done -- it is filled, in
   the app's one primary style (--pri), never the tier's colour: the tier is
   on the card's ring, badge and frame, and amber spent on a fifth thing
   too (the button) left nothing for it to mean. A
   working card asks nothing, so everything on it stays a ghost; filling every
   card's first button turned the board into a wall of colour. Actionable
   signals (CI, allow, deny, a ticket) join the row as ghosts in their own
   colour. Labels stay bare text: intent.js reads a chip's verb off its label. */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border-radius:7px;
  border:1px solid var(--edge);background:transparent;color:var(--fg);
  font:600 var(--fs-3)/1 system-ui;white-space:nowrap;user-select:none;-webkit-user-select:none}
.chip.pri{background:var(--pri);border-color:var(--pri);color:var(--ink)}
.chip.pri:hover{filter:brightness(1.12)}
.chip.sig{font-weight:500}
/* A signal the collector sends in attend's amber (lookout running, CI
   running, a plan's go) is not a call on you, so it wears the link colour. */
.sig.acc{color:var(--link)}
/* A signal's colour, lifted by render.js for each mode: --sg on dark, --sgl
   on light (the light blocks repeat this with --sgl). */
.sig[style*="--sg"]{color:var(--sg)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sig[style*="--sg"]{color:var(--sgl)}}
:root[data-theme="light"] .sig[style*="--sg"]{color:var(--sgl)}
.chip.pane{font-size:var(--fs-1);padding-inline:5px}
.chip.pane.outside{border-style:dashed;color:var(--fg2)}

/* --- the panes ----------------------------------------------------------- */
/* Every pane in the workspace, one thin row each under what the card said:
   its dot (a terminal's chevron), who it is, then its state and how long, or
   what the terminal is running. The [plan] and [outside] tags sit on their
   pane. A row is 24px, the footer links' height: a target, but the card's
   chips stay the bigger ones. The dot wears the tier colours: waiting is the
   attend amber, working the running blue, the rest grey. */
.pns{margin-top:4px;display:flex;flex-direction:column}
.pn{display:flex;align-items:center;gap:7px;min-height:24px;padding:0 6px;margin:0 -6px;
  border-radius:5px;font:var(--fs-2)/1.3 system-ui;color:var(--fg);cursor:pointer;min-width:0}
.pn:hover{background:var(--hover-fg)}
.pn>.pg{flex:none;width:7px;height:7px;border-radius:50%;background:var(--quiet)}
.pn.wait>.pg{background:var(--attend)} .pn.work>.pg{background:var(--running)}
.pn.term>.pg{width:8px;height:8px;border-radius:0;background:none;fill:none;
  stroke:var(--grey);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pn>.pk{flex:none;font-weight:500}
.pn.term>.pk{font:var(--fs-2)/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--grey)}
.pn>.pw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grey);
  font-variant-numeric:tabular-nums}
.pn.wait>.pw{color:var(--attend-t)}
.pn.term>.pw{font:var(--fs-2)/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2)}
.ptag{flex:none;font:600 var(--fs-1)/1 system-ui;padding:2px 5px;border:1px solid var(--edge);
  border-radius:4px;color:var(--fg)}
.ptag.plan{margin-left:auto}
.pn>.pw+.ptag.outside,.pn>.pk+.ptag.outside{margin-left:auto}
.ptag.plan+.ptag.outside{margin-left:0}
.ptag.outside{border-style:dashed;color:var(--fg2)}

/* --- the footer -------------------------------------------------------- */
/* Branch, uncommitted work, PR, issue, status signals, progress, spend: the
   facts you recognise a row by, in one line that wraps only when it must
   (code tokens in mono, words in sans). The links are
   24px tall -- smaller than a button, still a target -- and underlined, because
   that is what says "this opens something". Status signals are plain text in
   their own colour and do not react. */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:0 9px;margin-top:3px;min-width:0;
  font:var(--fs-2)/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--grey);
  font-variant-numeric:tabular-nums}
.foot>span{min-height:24px;line-height:24px;white-space:nowrap;min-width:0;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.branch,.pr,.issue{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px}
.branch{color:var(--fg2);text-decoration-color:var(--edge)}
.branch:hover{color:var(--fg);text-decoration-color:var(--fg)}
.pr{color:var(--grey);text-decoration-color:currentColor}
.pr.open{color:var(--pr-open)}
.issue{color:var(--issue);text-decoration-color:currentColor}
.pr:hover,.issue:hover{filter:brightness(1.25)}
/* Uncommitted work: a small hollow ring in the neutral text tier, then the
   word, small. Not a dot and not amber, so it is not read as a status or as
   "needs you"; the ring alone was a glyph you had to hover to read. A footer
   carrying it may wrap (render.js), so the word never clips the branch. */
.dirty{display:inline-flex;align-items:center;gap:4px;color:var(--dirty)}
.foot>.dirty{font-size:var(--fs-1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.dirty::before{content:"";flex:none;width:7px;height:7px;box-sizing:border-box;
  border:1.5px solid currentColor;border-radius:50%}
/* Words are in the UI's sans: the progress count and the status signals. Mono
   is for the code tokens (branch, PR, issue). */
.foot>.meta,.foot>.sig{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
/* The worktree's colour, before its branch. */
.cost{margin-left:auto;color:var(--fg2)}
.cost.small{color:var(--grey)}
/* The footer is the open card's: an open card is the expanded view, so its
   branch, unsaved work, progress and spend show there at rest, in the flow,
   with no hover reveal. A folded card has no footer (.fold is gone); its
   header's tooltip names the same facts. Hover changes no row's size.
   With only those facts on it (.one) it keeps to one line, and a long branch
   gives way with an ellipsis rather than push the spend onto a second. */
.foot.one{flex-wrap:nowrap}
.foot.one>:not(.branch){flex-shrink:0}

.foot>.end{display:inline-flex;align-items:center;gap:9px;margin-left:auto;
  overflow:visible;max-width:none}
.foot>.end>.cost{margin-left:0}

/* --- the reply window -------------------------------------------------- */
/* The animation's DURATION is the time remaining, set inline per row, so the

   resident timer, and nothing to go stale between pushes. */

.feed{margin-top:7px;height:3px;border-radius:2px;background:var(--bg2);overflow:hidden}
.feedbar{display:block;height:100%;border-radius:2px;background:var(--attend);
  transform-origin:left center;animation:drain linear 1 forwards}

/* --- a quiet row ------------------------------------------------------- */
/* One line: the dot, the name, then its ghost buttons (diff, pr) or, with none,
   its badge -- and no badge at all when it has none. No dial, no said, no
   footer: the whole row is the target and it selects the workspace. Recessed by losing the card's fill, not by fading: an opacity
   dim took the name under 4.5:1. */

  padding:3px 9px;margin-bottom:3px}
.row.quiet>.fold>.foot{margin-top:2px}
.row.quiet>.top{min-height:22px}
.row.quiet>.top>.chips{display:inline-flex;flex:none;flex-wrap:nowrap;gap:5px;margin:0}
.row.quiet>.top>.chips>.chip{padding:0 9px}
.row.quiet>.top>.nm{font-weight:500;font-size:var(--fs-3);color:var(--fg2)}
.row.quiet>.top>.cost{margin-left:0;font:var(--fs-2)/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
.sect{color:var(--grey);font:600 var(--fs-1)/1.3 system-ui;letter-spacing:.06em;text-transform:uppercase;
  margin:7px 0 3px;padding-top:4px;border-top:1px solid var(--line)}

/* --- muted and tucked (the app's, read from tucked.json) ----------------- */
/* Muted (hidden until it needs you): greyed (never by opacity: the contrast check could not see it). Tucked: out of the list, in a
   collapsed "hidden · N" shelf at the end, with snoozed and settled rows; each says why. The ⋯ menu, its Hide items grouped by dividers, shows only framed by the app. */
.row.muted{filter:saturate(.35)}
.row.muted>.top>.nm,.row.muted>.top>.badge,.row.muted>.top>.bs>.badge{color:var(--grey)}
details.away>summary{cursor:pointer;list-style:none}

details.away[open]>summary::before{content:"\25BE  "}
/* On the shelf every row is one plain line, whatever its tier: no border, no
   card ground, the name left and its why right in muted words. A bordered
   pill per row read as four more cards. The whole line lifts on hover (its
   header's own lift steps aside, so it is one ground), and the header jumps,
   as any row's does. */
#rows details.away>.row{--gnd:var(--bg);background:transparent;border:0;
  padding:3px 5px;margin-bottom:0}

details.away>.row>.top>.nm{font-weight:500;font-size:var(--fs-3);color:var(--fg2)}

.why{flex:none;margin-left:6px;color:var(--grey);font:400 var(--fs-2)/1.2 system-ui;white-space:nowrap}
/* A settled row's reclaim, a link in its why. */
.why>.rcl{color:var(--fg2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--edge);
  text-decoration-thickness:1px;text-underline-offset:3px}
.why>.rcl:hover{color:var(--fg);text-decoration-color:var(--fg)}
/* The badge's slot: the badge, then the ⋯ after it in the line, never over it,
   so the badge and a limit's pill read in full while you point at them. */

.bs.nob{margin-left:-7px}

  margin-left:2px;border-radius:5px;color:var(--grey);cursor:pointer}

   as the footer facts do. Where there is a pointer it takes no width at rest

   in the line. */

.row.tkopen>.top{position:relative}

/* --- a family ---------------------------------------------------------- */
/* A deep-plan family is one card: the parent's, with its children inside it as
   sub-rows on a darker well. A child is one line -- caret, dial, dot, name,
   badge -- until it is opened, and then it is its whole card, in place. A child
   that needs you or is broken also shows its line and its filled button while
   closed. Its header (at least 34px tall) jumps; its caret folds. A family
   with no parent row gets a shell card named by its label (.shell). */

.kid.attend .kidhd .nm,.kid.wilt .kidhd .nm{font-weight:600}

.caret::before{content:"\25B8"}
.row.open>.top>.caret::before{content:"\25BE"}
.said.nest{margin:0 0 8px 35px;cursor:pointer}
.kbody{display:none;padding:0 0 10px 15px}
.kbody>.said:first-child{margin-top:0}
.kid.open .kbody{display:block}
.kid.open .nest,.kid.open .kidhd .chip{display:none}

   steps aside so the name is not the thing that gets clipped. */
.kid:not(.open)>.kidhd.loud>.badge{display:none}
/* The parent's badge counts its children's most urgent tier. */
.badge.roll.attend{color:var(--attend-t)} .badge.roll.wilt{color:var(--wilt-tx)}
.row.shell .nm{font-weight:600}

/* Fires once, on the transition into done -- render.js gates it with data-prev. */
@keyframes ripple{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 50%,transparent)}
  100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--done) 0%,transparent)}}
.row.ripple{animation:ripple 900ms ease-out 1}

/* Pixel confetti, on the same push as the ripple and only then: square bits
   that burst up from the card's top edge and fall away, in steps, because a
   tween would blur them. render.js picks each bit's spot, drift and colour
   from the row id, so a card throws the same handful every time. A family's
   card throws a bigger one (.famdone) when its last child turns done. */
.confetti{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;z-index:2}

.pip{display:block;width:10px;height:9px;fill:var(--quiet)}

.pip.wilt{fill:var(--wilt)} .pip.done{fill:var(--done)}

   set-transform / force-reflow / clear-transform dance. What CSS owns is the
   accent that says WHY a row moved. */

   tier colour, brightest at the moment it arrives. Rows that sank get nothing:
   losing urgency is not news. */
@keyframes climb{0%{box-shadow:0 0 0 2px var(--c)}100%{box-shadow:0 0 0 2px transparent}}
.row.up{animation:climb 900ms ease-out 1}

   that does both on one push shows the one that says more. */
.row.up.ripple{animation:ripple 900ms ease-out 1}
.row.up.famdone{animation:famdone 1.4s ease-out 1}

   moves, only on rows that are actually waiting on a human, and the button
   itself never fades -- its label stays at full contrast. */

<header>
  <!-- The shelf is the full width of the board and the cat walks the length of it.
       fa-cat / md-cat exist in cmux's icon set as font glyphs, but a glyph cannot
       flick its tail, so the cat is drawn here instead. -->
  <div id="shelf">
    <!-- The sky behind the shelf: render.js sets data-sky from the local hour
         at each push, and CSS cross-fades these four layers over a minute. -->
    <div class="sky dawn"></div><div class="sky day"></div><div class="sky dusk"></div>
    <div class="sky night"><i class="stars"></i></div><i class="orb"></i>
<div id="cat" class="nap" aria-hidden="true"><i class="facing"><i class="body"></i></i><i class="heart"></i><i class="zz z0">z</i><i class="zz z1">z</i><i class="zz z2">z</i></div>
  </div>
  <div class="hud">
    <span id="need">…</span>
    <span id="tally"></span>
    <button type="button" id="foldall" hidden>collapse all</button>
  </div>
  <div class="hud2">
    <span id="says"></span>
    <span class="right"><span id="src"></span><span id="stamp-label"></span><span id="stamp"></span></span>
  </div>
</header>
<div id="rows" data-prev="{}" data-open="[]">
  <!-- Overwritten by the first push. Present so a restored-but-unpushed surface
       explains itself instead of looking broken. -->
  <div class="empty">Waiting for the first push.<br>The listener pushes on startup, on workspace events and every 120s — <code>crew listen status</code></div>
</div>
<div id="quiet"></div>
<details id="news" hidden>
  <summary><span id="news-ttl">notifications</span><span id="news-lede"></span></summary>
  <div id="news-body"></div>
</details>
</body></html>
